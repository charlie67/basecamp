spring.application.name=basecamp

spring.datasource.url=jdbc:postgresql://localhost:5432/basecamp
spring.datasource.username=basecamp
spring.datasource.password=basecamp

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-null-for-primitives=false

# The issuer URI is the Authentik OIDC provider's issuer (ends in a trailing slash).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI}

authentik.enabled=true

osmaps.api-key=${OSMAP_API_KEY}
osmaps.api-url=https://api.os.uk/maps/raster/v1/zxy

mapbox.api-key=${MAPBOX_API_KEY}
mapbox.api-url=https://api.mapbox.com/styles/v1/mapbox

s3.endpoint=https://s3.home.charlie.to
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.region=garage
s3.bucket=basecamp
s3.path-style-access=true