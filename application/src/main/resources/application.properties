spring.application.name=basecamp

spring.datasource.url=jdbc:postgresql://localhost:5432/basecamp
spring.datasource.username=basecamp
spring.datasource.password=basecamp

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
# Every series carries the application, so dashboards can pick basecamp out of everything
# else Prometheus holds.
management.metrics.tags.application=${spring.application.name}
# Buckets rather than client-side percentiles, so latency quantiles can be worked out in
# Prometheus across any time window and summed across URIs.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles-histogram.basecamp.s3.requests=true
# The prefixes above would otherwise also give buckets to the in-flight request gauges.
management.metrics.distribution.percentiles-histogram.http.server.requests.active=false
management.metrics.distribution.percentiles-histogram.http.client.requests.active=false

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-null-for-primitives=false

# The issuer URI is the Authentik OIDC provider's issuer (ends in a trailing slash).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI}

authentik.enabled=true

osmaps.api-key=${OSMAP_API_KEY}
osmaps.api-url=https://api.os.uk/maps/raster/v1/zxy

mapbox.api-key=${MAPBOX_API_KEY}
mapbox.api-url=https://api.mapbox.com/styles/v1/mapbox

s3.endpoint=https://s3.home.charlie.to
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.region=garage
s3.bucket=basecamp
s3.path-style-access=true