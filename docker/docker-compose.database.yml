version: '2'
services:

  basecamp-db:
    container_name: basecamp-db
    image: postgres:18.2-alpine3.23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: basecamp
      POSTGRES_PASSWORD: basecamp
      POSTGRES_DB: basecamp
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/db/:/var/lib/postgresql