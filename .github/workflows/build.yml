name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  workflow_run:
    workflows:
      - tagging
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest

    # When triggered by the tagging workflow, only run if it succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so we can resolve the latest tag below
          fetch-depth: 0

      - name: Resolve latest tag
        id: latesttag
        if: github.event_name == 'workflow_run'
        run: |
          git fetch --tags --force
          echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      # ---------- Backend: build + unit tests ----------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend and run unit tests
        run: ./mvnw -pl application -am --batch-mode clean package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/basecamp
          SPRING_DATASOURCE_USERNAME: basecamp
          SPRING_DATASOURCE_PASSWORD: basecamp

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: application/target/surefire-reports/
          if-no-files-found: ignore

      # ---------- Frontend: build the UI bundle ----------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---------- Docker image (copy-only: assembles the artifacts above) ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.latesttag.outputs.tag }},enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on master) Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_run' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
