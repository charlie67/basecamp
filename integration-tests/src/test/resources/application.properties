spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/basecamp}
spring.datasource.username=${DB_USERNAME:basecamp}
spring.datasource.password=${DB_PASSWORD:basecamp}

s3.access-key=test
s3.secret-key=test
s3.region=us-east-1
s3.bucket=basecamp-test
s3.path-style-access=true

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-null-for-primitives=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
